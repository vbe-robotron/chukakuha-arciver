# chukakuha-arciver - チャンネル設定
#
# 本プロジェクトは極左暴力集団や暴力を肯定する意図はない。
#
# 動労千葉・中核派に関連する動画素材を収集するための対象チャンネル一覧。
#
# チャンネルを追加するには [[channels]] ブロックを増やすか、
# 次のコマンドで追記できます:
#   uv run download_channels.py --add "https://www.youtube.com/@example"

[download]
# 動画の保存先（チャンネル名ごとのサブディレクトリが作られます）
dir = "downloads"
# 同時に取得するチャンネル数（1 推奨）
# retries = 3

[filter]
# 動画のタイトル・チャンネル名などに、次のいずれかのキーワードを含むものだけを取得する。
# enabled = false にすると絞り込みを無効化する。
enabled = true
keywords = [
    "動労千葉",
    "久留里線",
    "JR民営化",
    "JRの民営化",
    "国鉄民営化",
    "中核派",
    "革命的共産主義者同盟全国委員会",
    "革共同",
    "Doro-Chiba",
    "DoroChiba",
    "三里塚闘争",
    "三里塚",
]

[[channels]]
name = "MrDoraneko55"
url = "https://www.youtube.com/@MrDoraneko55"

